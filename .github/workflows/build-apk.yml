name: Build Android APKs (GitHub runners)

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app(s) to build"
        type: choice
        options:
          - all
          - rider
          - customer
          - merchant
        default: all
  push:
    branches: [main]
    paths:
      - "mobile/rider-app/**"
      - "mobile/customer-app/**"
      - "mobile/merchant-app/**"

# Avoid stacking builds when pushes land back-to-back.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=4"
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  # @sentry/react-native's gradle hook runs sentry-cli to upload source maps
  # on release builds, which needs a SENTRY_AUTH_TOKEN (present in EAS env, not
  # on GitHub runners). Disable that upload for these test APKs - crash reports
  # still work, only source-map upload is skipped.
  SENTRY_DISABLE_AUTO_UPLOAD: "true"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.apps.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rider: 'mobile/rider-app/**'
            customer: 'mobile/customer-app/**'
            merchant: 'mobile/merchant-app/**'
      - name: Compute apps to build
        id: apps
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.app }}" in
              rider)    echo 'list=["rider"]' >> "$GITHUB_OUTPUT" ;;
              customer) echo 'list=["customer"]' >> "$GITHUB_OUTPUT" ;;
              merchant) echo 'list=["merchant"]' >> "$GITHUB_OUTPUT" ;;
              *)        echo 'list=["rider","customer","merchant"]' >> "$GITHUB_OUTPUT" ;;
            esac
          else
            # Push-triggered builds only when the commit message carries "[apk]"
            # (mirrors the "[full]" convention the deploy webhook already uses).
            if [ "${{ contains(github.event.head_commit.message, '[apk]') }}" != "true" ]; then
              echo 'list=[]' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            apps=()
            [ "${{ steps.filter.outputs.rider }}" = "true" ] && apps+=("rider")
            [ "${{ steps.filter.outputs.customer }}" = "true" ] && apps+=("customer")
            [ "${{ steps.filter.outputs.merchant }}" = "true" ] && apps+=("merchant")
            if [ ${#apps[@]} -eq 0 ]; then
              echo 'list=[]' >> "$GITHUB_OUTPUT"
            else
              printf 'list=["%s"]\n' "$(IFS=,; echo "${apps[*]}" | sed 's/,/","/g')" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: changes
    name: "APK ${{ matrix.app }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/${{ matrix.app }}-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Install app dependencies
        working-directory: mobile/${{ matrix.app }}-app
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # Persist the debug keystore across runs so each new build installs as an
      # update over the previous one. Restore BEFORE prebuild: expo prebuild
      # auto-generates android/app/debug.keystore only when it's missing, so a
      # cached one is kept and reused (and no keytool step to conflict with).
      - name: Prepare android dir for keystore cache
        working-directory: mobile/${{ matrix.app }}-app
        run: mkdir -p android/app

      - name: Restore cached signing keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: mobile/${{ matrix.app }}-app/android/app/debug.keystore
          key: ${{ matrix.app }}-android-debug-keystore

      - name: Generate native android project (expo prebuild)
        working-directory: mobile/${{ matrix.app }}-app
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/${{ matrix.app }}-app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iprime-${{ matrix.app }}-preview
          path: mobile/${{ matrix.app }}-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
