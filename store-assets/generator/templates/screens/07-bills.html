<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../brand.css">
  <link rel="stylesheet" href="screens.css">
</head>
<body>
  <div class="canvas">
    <header class="head">
      <div class="eyebrow">BILLS &amp; AIRTIME</div>
      <h1 class="headline">Airtime, data,<br><span class="o">bills.</span></h1>
      <p class="sub">Top up and pay bills right inside the iPrime Merchant app.</p>
    </header>
    <div class="stage">
      <div class="phone"><div class="screen">
        <div data-statusbar></div>
        <div class="app">
          <div class="appbar"><div class="h1">Pay bills</div></div>
          <div class="list">
            <div class="card">
              <div class="sect-title">Airtime</div>
              <div class="operators">
                <div class="op active">MTN</div><div class="op">Airtel</div><div class="op">Glo</div><div class="op">9mobile</div>
              </div>
              <div class="amount-display"><span class="cur">&#8358;1,000</span></div>
              <div class="chips">
                <div class="chip">&#8358;500</div><div class="chip" style="border-color:var(--brand);background:var(--brand-soft);color:var(--brand-strong)">&#8358;1,000</div>
                <div class="chip">&#8358;2,000</div><div class="chip">&#8358;5,000</div>
              </div>
              <div class="btnrow"><div class="btn brand">Pay &#8358;1,000</div></div>
            </div>
            <div class="card">
              <div class="row"><span class="row-l">Phone</span><span class="row-v">0803 456 7890</span></div>
              <div class="row"><span class="row-l">Wallet balance</span><span class="row-v">&#8358;182,450.00</span></div>
            </div>
          </div>
        </div>
      </div></div>
    </div>
    <footer class="foot">
      <div class="lockup"><span class="brand">iPrime</span><span class="badge">MERCHANT</span></div>
      <div class="url">iprime.ng/merchant</div>
    </footer>
    <div class="bottombar"></div>
  </div>
  <script src="frame.js"></script>
</body>
</html>
