<!doctype html>
<html lang="en" data-device="ios">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../brand.css">
  <link rel="stylesheet" href="screens.css">
</head>
<body>
  <div class="bezel">
    <div class="screen">
      <div data-statusbar></div>
      <div class="app">
        <div class="appbar"><div class="appbar-row"><div class="h1">Products</div><div class="addbtn">+ Add product</div></div></div>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
          Search products
        </div>
        <div class="list">
          <div class="card prod">
            <div class="thumb" style="background:#FFF0E8;color:#EA580C">J</div>
            <div class="prod-info"><div class="prod-name">Jollof Rice</div><div class="placeholder">&#8358;3,500 &middot; 24 in stock</div></div>
            <div class="switch on"></div>
          </div>
          <div class="card prod">
            <div class="thumb" style="background:#EFF6FF;color:#2563EB">C</div>
            <div class="prod-info"><div class="prod-name">Grilled Chicken</div><div class="placeholder">&#8358;1,200 &middot; 50 in stock</div></div>
            <div class="switch on"></div>
          </div>
          <div class="card prod">
            <div class="thumb" style="background:#ECFDF5;color:#059669">G</div>
            <div class="prod-info"><div class="prod-name">Coca-Cola 50cl</div><div class="placeholder">&#8358;300 &middot; 120 in stock</div></div>
            <div class="switch on"></div>
          </div>
          <div class="card prod">
            <div class="thumb" style="background:#F5F3FF;color:#7C3AED">M</div>
            <div class="prod-info"><div class="prod-name">Meat Pie</div><div class="placeholder">&#8358;700 &middot; Out of stock</div></div>
            <div class="switch off"></div>
          </div>
        </div>
      </div>
      <div data-tabbar="more"></div>
      <div data-homebar></div>
    </div>
  </div>
  <script src="frame.js"></script>
</body>
</html>
